name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: TileMama
  PRODUCT_NAME: tilemama
  BUNDLE_ID: com.tilemama.game
  LOVE_REF: "11.5"

jobs:
  package:
    name: Package .love
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .love package
        working-directory: love
        run: 7z a -tzip -mx=0 ../tilemama.love main.lua conf.lua src assets
      - name: Upload .love package
        uses: actions/upload-artifact@v4
        with:
          name: love-package
          path: tilemama.love
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: love-package
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Android package
        uses: love-actions/love-actions-android@v2
        with:
          app-name: ${{ env.APP_NAME }}
          bundle-id: ${{ env.BUNDLE_ID }}
          love-ref: ${{ env.LOVE_REF }}
          love-patch: .github/android/portrait.patch
          love-package: tilemama.love
          resource-path: .github/android/res
          icon-specifier: "@mipmap/ic_launcher"
          product-name: ${{ env.PRODUCT_NAME }}
          version-string: ${{ steps.version.outputs.version }}
          version-code: ${{ github.run_number }}
          output-folder: dist
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  linux:
    name: Linux (AppImage / deb)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: love-package
      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0-dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Linux packages
        uses: love-actions/love-actions-linux@v2
        with:
          app-name: ${{ env.APP_NAME }}
          bundle-id: ${{ env.BUNDLE_ID }}
          description: TileMama - LÖVE puzzle game
          version-string: ${{ steps.version.outputs.version }}
          icon-path: .github/linux/icon.png
          love-ref: ${{ env.LOVE_REF }}
          love-package: tilemama.love
          build-deb: true
          product-name: ${{ env.PRODUCT_NAME }}
          output-folder: dist
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  windows:
    name: Windows (zip)
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: love-package
      - name: Build Windows packages
        uses: love-actions/love-actions-windows@v2
        with:
          love-ref: ${{ env.LOVE_REF }}
          love-package: tilemama.love
          icon-path: .github/windows/icon.ico
          product-name: ${{ env.PRODUCT_NAME }}
          output-folder: dist
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
